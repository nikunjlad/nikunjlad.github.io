<head>

  <!-- Set theme ASAP to avoid FOUC. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("nl-theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PGPSQRQB5E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-PGPSQRQB5E');
  </script>

  <link href="https://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">

  {% seo %}

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Theme CSS (legacy Hyde/Poole baseline) -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/poole.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/syntax.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/hyde.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/nikunj.css">

  <!-- Modern refresh layer (must load last) -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/modern.css">

  <!-- JS -->
  <script src="{{ site.baseurl }}/public/js/modern.js"></script>
  <script src="{{ site.baseurl }}/public/js/nikunj.js"></script>

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ site.baseurl }}/public/apple-touch-icon-144-precomposed.png">
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico">

  <!-- Feed (jekyll-feed) -->
  {% feed_meta %}

  <!-- ipmeta.io Network Tracking -->
  <script src="https://ipmeta.io/plugin.js"></script>

  <script>
     provideGtagPlugin({
        apiKey: '{{ site.ipmeta_api_key | default: ENV["IPMETA_API_KEY"] }}',
        serviceProvider: 'dimension1',
        networkDomain: 'dimension2',
        networkType: 'dimension3',
     });
  </script>
</head>
