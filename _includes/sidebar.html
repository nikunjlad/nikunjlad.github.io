<div class="sidebar">
  <div class="container left-align">
    <div class="sidebar-about">
      <h1>
        <a href="{{ site.baseurl }}/">
          {{ site.title }}
        </a>
      </h1>
      <p class="lead">{{ site.description }}</p>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-nav-item" href="{{ site.baseurl }}/about/">About</a>
      <a class="sidebar-nav-item" href="{{ site.baseurl }}/experience/">Experience</a>
      <a class="sidebar-nav-item" href="{{ site.baseurl }}/projects/">Projects</a>
      <a class="sidebar-nav-item" href="{{ site.baseurl }}/publications/">Publications</a>
      <a class="sidebar-nav-item" href="{{ site.baseurl }}/service/">Talks &amp; Service</a>
      {%- comment -%}
      Blog hidden until first post is published. Re-enable by uncommenting:
      <a class="sidebar-nav-item" href="{{ site.baseurl }}/blog/">Blog</a>
      {%- endcomment -%}
    </nav>

    <ul id="sidebar-buttons">
      <li>
        <a href="mailto:{{ site.author.email }}" class="icon-btn" title="Email" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="{{ site.author.github }}" target="_blank" rel="noopener" class="icon-btn" title="GitHub" aria-label="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

          </svg>
        </a>
      </li>
      <li>
        <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener" class="icon-btn" title="LinkedIn" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.95v5.66H9.36V9h3.41v1.56h.05a3.74 3.74 0 0 1 3.36-1.85c3.6 0 4.27 2.37 4.27 5.45v6.29ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12Zm1.78 13.02H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="{{ site.author.twitter }}" target="_blank" rel="noopener" class="icon-btn" title="Twitter / X" aria-label="Twitter">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://scholar.google.com/citations?user=is6g3oAAAAAJ&hl=en" target="_blank" rel="noopener" class="icon-btn" title="Google Scholar" aria-label="Google Scholar">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 14.6 0 5.4 12 .2l12 5.2zm0 1.4 7.7-5.9c.4 1 .6 2.1.6 3.3a8.3 8.3 0 1 1-16.6 0c0-1.2.2-2.3.6-3.3z"/>
          </svg>
        </a>
      </li>
      <li>
        <button type="button" id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme" style="cursor:pointer;">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
      </li>
    </ul>

    <p id="credits">&copy; {{ site.time | date: '%Y' }}. <a href="{{ site.baseurl }}/credits">Credits</a>.</p>
  </div>
</div>
